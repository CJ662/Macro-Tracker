<script>
    const GOALS = { cals: 2336, protein: 146, carbs: 292, fat: 65, goalWeight: 165.0 };

    // Formats date to local YYYY-MM-DD instead of UTC
    function getLocalDateString(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let activeDate = new Date();
    let currentDateKey = getLocalDateString(activeDate);

    function updateDateDisplay() {
      currentDateKey = getLocalDateString(activeDate);
      document.getElementById('currentDateDisplay').innerHTML = `
        <button onclick="changeDay(-1)" style="background:none;border:none;color:var(--accent);cursor:pointer;font-weight:bold;padding:0 4px;">◀</button>
        ${currentDateKey}
        <button onclick="changeDay(1)" style="background:none;border:none;color:var(--accent);cursor:pointer;font-weight:bold;padding:0 4px;">▶</button>
      `;
      render();
    }

    function changeDay(delta) {
      activeDate.setDate(activeDate.getDate() + delta);
      updateDateDisplay();
    }

    function getStorage(key, defaultVal) {
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : defaultVal;
    }

    function setStorage(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('foodTab').style.display = 'none';
      document.getElementById('workoutTab').style.display = 'none';
      document.getElementById('weightTab').style.display = 'none';
      
      if (tab === 'food') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('foodTab').style.display = 'block';
      } else if (tab === 'workout') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('workoutTab').style.display = 'block';
      } else {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('weightTab').style.display = 'block';
      }
    }

    function toggleSettings() {
      const p = document.getElementById('settingsPanel');
      p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('GEMINI_API_KEY', key);
      alert('API Key Saved to Device');
    }

    async function callGemini(prompt) {
      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) return null;
      
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: "application/json" }
      };

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      return JSON.parse(data.candidates[0].content.parts[0].text);
    }

    async function handleFoodSubmit() {
      const text = document.getElementById('foodInput').value.trim();
      if (!text) return;
      const btn = document.getElementById('logFoodBtn');
      btn.textContent = 'Parsing macros...';

      let parsed = { description: text, calories: 300, protein: 15, carbs: 35, fat: 10 };

      try {
        const prompt = `Extract food items and return precise JSON: {"description": "summary", "calories": number, "protein": number, "carbs": number, "fat": number} for: "${text}"`;
        const aiRes = await callGemini(prompt);
        if (aiRes) parsed = aiRes;
      } catch (err) {
        console.error(err);
      }

      const entries = getStorage(`entries_${currentDateKey}`, []);
      entries.push({ type: 'food', ...parsed, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      setStorage(`entries_${currentDateKey}`, entries);

      document.getElementById('foodInput').value = '';
      btn.textContent = 'Log Meal';
      render();
    }

    async function handleWorkoutSubmit() {
      const text = document.getElementById('workoutInput').value.trim();
      if (!text) return;
      const btn = document.getElementById('logWorkoutBtn');
      btn.textContent = 'Calculating burn...';

      let parsed = { description: text, burned: 150 };

      try {
        const prompt = `Extract workout and estimated calories burned. Return JSON: {"description": "activity & sets/reps summary", "burned": number} for: "${text}"`;
        const aiRes = await callGemini(prompt);
        if (aiRes) parsed = aiRes;
      } catch (err) {
        console.error(err);
      }

      const entries = getStorage(`entries_${currentDateKey}`, []);
      entries.push({ type: 'workout', ...parsed, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      setStorage(`entries_${currentDateKey}`, entries);

      document.getElementById('workoutInput').value = '';
      btn.textContent = 'Log Workout';
      render();
    }

    function handleWeightSubmit() {
      const val = parseFloat(document.getElementById('weightInput').value);
      if (val) {
        setStorage('latest_weight', val);
        document.getElementById('weightInput').value = '';
        render();
      }
    }

    function deleteEntry(index) {
      const entries = getStorage(`entries_${currentDateKey}`, []);
      entries.splice(index, 1);
      setStorage(`entries_${currentDateKey}`, entries);
      render();
    }

    function render() {
      const entries = getStorage(`entries_${currentDateKey}`, []);
      const latestWeight = getStorage('latest_weight', 148.0);
      document.getElementById('currentWeightVal').innerHTML = `${latestWeight.toFixed(1)} <span style="font-size:0.8rem">lb</span>`;

      let totalCals = 0, totalP = 0, totalC = 0, totalF = 0, totalBurned = 0;
      const listEl = document.getElementById('entriesList');
      listEl.innerHTML = '';

      if (entries.length === 0) {
        listEl.innerHTML = '<div style="font-size:0.85rem; color:var(--muted); padding:8px 0;">No entries recorded today.</div>';
      }

      entries.forEach((entry, idx) => {
        const row = document.createElement('div');
        row.className = 'entry-item';
        if (entry.type === 'food') {
          totalCals += entry.calories;
          totalP += entry.protein;
          totalC += entry.carbs;
          totalF += entry.fat;
          row.innerHTML = `
            <div>
              <div class="entry-title">${entry.description}</div>
              <div class="entry-meta">${entry.calories} kcal • ${entry.carbs}g C / ${entry.protein}g P / ${entry.fat}g F • ${entry.time}</div>
            </div>
            <button class="del-btn" onclick="deleteEntry(${idx})">✕</button>
          `;
        } else {
          totalBurned += entry.burned;
          row.innerHTML = `
            <div>
              <div class="entry-title">🏋️ ${entry.description}</div>
              <div class="entry-meta">+${entry.burned} kcal burned • ${entry.time}</div>
            </div>
            <button class="del-btn" onclick="deleteEntry(${idx})">✕</button>
          `;
        }
        listEl.appendChild(row);
      });

      const effectiveTarget = GOALS.cals + totalBurned;
      const remaining = effectiveTarget - totalCals;

      document.getElementById('calRemainingVal').textContent = Math.round(remaining);
      document.getElementById('calBudgetSub').textContent = `Consumed: ${Math.round(totalCals)} | Burned: ${Math.round(totalBurned)}`;
      document.getElementById('calBar').style.width = `${Math.min(100, (totalCals / effectiveTarget) * 100)}%`;

      document.getElementById('proteinVal').innerHTML = `${Math.round(totalP)}<span style="font-size:0.75rem; color:var(--muted)">/${GOALS.protein}g</span>`;
      document.getElementById('proteinBar').style.width = `${Math.min(100, (totalP / GOALS.protein) * 100)}%`;

      document.getElementById('carbsVal').innerHTML = `${Math.round(totalC)}<span style="font-size:0.75rem; color:var(--muted)">/${GOALS.carbs}g</span>`;
      document.getElementById('carbsBar').style.width = `${Math.min(100, (totalC / GOALS.carbs) * 100)}%`;

      document.getElementById('fatVal').innerHTML = `${Math.round(totalF)}<span style="font-size:0.75rem; color:var(--muted)">/${GOALS.fat}g</span>`;
      document.getElementById('fatBar').style.width = `${Math.min(100, (totalF / GOALS.fat) * 100)}%`;
    }

    if (localStorage.getItem('GEMINI_API_KEY')) {
      document.getElementById('apiKeyInput').value = localStorage.getItem('GEMINI_API_KEY');
    }
    
    updateDateDisplay();
  </script>
